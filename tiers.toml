# Built-in tier map. A row in config.toml overrides that one row.
# The file is $XDG_CONFIG_HOME/crew/config.toml, or ~/.config/crew/config.toml.
# Model strings are what the runner puts on the CLI.

[claude.fast]
model = "haiku"
effort = "medium"

[claude.balanced]
model = "sonnet"
effort = "medium"

[claude.smart]
model = "opus"
effort = "high"

[claude.max]
model = "opus"
effort = "max"

[codex.fast]
model = "gpt-6-luna"
effort = "low"

[codex.balanced]
model = "gpt-6-luna"
effort = "medium"

[codex.smart]
model = "gpt-6-luna"
effort = "high"

[codex.max]
model = "gpt-6-luna"
effort = "max"

[gemini.fast]
model = "gemini-3.8-flash-low"
effort = "low"

[gemini.balanced]
model = "gemini-3.8-flash-medium"
effort = "medium"

[gemini.smart]
model = "gemini-3.8-flash-high"
effort = "high"

[gemini.max]
model = "gemini-4-argon-high"
effort = "high"

# Effort is not a grok tier. -e sets it, and the default is medium.
[grok.fast]
model = "grok-4.7"

[grok.balanced]
model = "grok-4.7"

[grok.smart]
model = "grok-4.7"

[grok.max]
model = "grok-4.7"
