# Built-in tier map. A row in config.toml overrides that one row.
# The file is $XDG_CONFIG_HOME/crew/config.toml, or ~/.config/crew/config.toml.
# A tier is only a model. Effort is a separate word on the command, so a row
# that baked it in would make `crew models` lie about what the run does.
# With no tier, a run uses the balanced row (a config override of that row
# included). Grok is the exception: no tier sends no model.
# Gemini rows are family bases. The runner appends the effort slug itself.

[claude.fast]
model = "haiku"

[claude.balanced]
model = "sonnet"

[claude.smart]
model = "opus"

[claude.max]
model = "fable"

[codex.fast]
model = "gpt-6-luna"

[codex.balanced]
model = "gpt-6.1-sol"

[codex.smart]
model = "gpt-6-astra"

[codex.max]
model = "gpt-6-astra"

[gemini.fast]
model = "gemini-3.8-flash"

[gemini.balanced]
model = "gemini-4-argon"

[gemini.smart]
model = "gemini-4-argon"

[gemini.max]
model = "gemini-4-argon"

[grok.fast]
model = "grok-4.5"

[grok.balanced]
model = "grok-4.6"

[grok.smart]
model = "grok-4.7"

[grok.max]
model = "grok-4.7"
